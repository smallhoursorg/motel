# Rendered by motel from the Caddyfile's monitor block (notify/DESIGN-notify.md).
# Do not edit: motel rewrites this file on every config load and reloads
# Alertmanager. Every URL is a url_file beside it, never in this file.
global:
  resolve_timeout: 5m
route:
  receiver: blackhole
  group_by: [alertname, app, subject]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: heartbeat
      matchers: [alertname="Watchdog"]
      group_by: [alertname]
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4m
    - receiver: blackhole
      matchers: [notify_channel=~".+"]
      group_by: ['...']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: ch-alice
          matchers: [notify_channel="alice"]
        - receiver: ch-bob
          matchers: [notify_channel="bob"]
        - receiver: ch-ops
          matchers: [notify_channel="ops"]
        - receiver: ch-pager
          matchers: [notify_channel="pager"]
    - receiver: blackhole
      matchers: [alertname="deploy_in_progress"]
    - matchers: [kind="state", alertname="disk_low"]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 24h
      routes:
        - matchers: [severity="critical"]
          routes:
            - receiver: state-critical-ops
              continue: true
            - receiver: state-critical-pager
              continue: true
        - matchers: [severity="warning"]
          routes:
            - receiver: state-warning-ops
              continue: true
        - routes:
            - receiver: state-info-ops
              continue: true
    - matchers: [kind="event"]
      group_by: ['...']
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - matchers: [app="blog"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: event-critical-ops
                  continue: true
                - receiver: event-critical-pager
                  continue: true
                - receiver: event-critical-alice
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: event-warning-ops
                  continue: true
                - receiver: event-warning-alice
                  continue: true
            - routes:
                - receiver: event-info-ops
                  continue: true
                - receiver: event-info-alice
                  continue: true
        - matchers: [app="shop"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: event-critical-ops
                  continue: true
                - receiver: event-critical-pager
                  continue: true
                - receiver: event-critical-bob
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: event-warning-ops
                  continue: true
                - receiver: event-warning-bob
                  continue: true
            - routes:
                - receiver: event-info-ops
                  continue: true
        - matchers: [app="wiki"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: event-critical-ops
                  continue: true
                - receiver: event-critical-pager
                  continue: true
                - receiver: event-critical-alice
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: event-warning-ops
                  continue: true
                - receiver: event-warning-alice
                  continue: true
            - routes:
                - receiver: event-info-ops
                  continue: true
                - receiver: event-info-alice
                  continue: true
        - matchers: [severity="critical"]
          routes:
            - receiver: event-critical-ops
              continue: true
            - receiver: event-critical-pager
              continue: true
        - matchers: [severity="warning"]
          routes:
            - receiver: event-warning-ops
              continue: true
        - routes:
            - receiver: event-info-ops
              continue: true
    - matchers: [kind="state"]
      group_wait: 30s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - matchers: [app="blog"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: state-critical-ops
                  continue: true
                - receiver: state-critical-pager
                  continue: true
                - receiver: state-critical-alice
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: state-warning-ops
                  continue: true
                - receiver: state-warning-alice
                  continue: true
            - routes:
                - receiver: state-info-ops
                  continue: true
                - receiver: state-info-alice
                  continue: true
        - matchers: [app="shop"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: state-critical-ops
                  continue: true
                - receiver: state-critical-pager
                  continue: true
                - receiver: state-critical-bob
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: state-warning-ops
                  continue: true
                - receiver: state-warning-bob
                  continue: true
            - routes:
                - receiver: state-info-ops
                  continue: true
        - matchers: [app="wiki"]
          routes:
            - matchers: [severity="critical"]
              routes:
                - receiver: state-critical-ops
                  continue: true
                - receiver: state-critical-pager
                  continue: true
                - receiver: state-critical-alice
                  continue: true
            - matchers: [severity="warning"]
              routes:
                - receiver: state-warning-ops
                  continue: true
                - receiver: state-warning-alice
                  continue: true
            - routes:
                - receiver: state-info-ops
                  continue: true
                - receiver: state-info-alice
                  continue: true
        - matchers: [severity="critical"]
          routes:
            - receiver: state-critical-ops
              continue: true
            - receiver: state-critical-pager
              continue: true
        - matchers: [severity="warning"]
          routes:
            - receiver: state-warning-ops
              continue: true
        - routes:
            - receiver: state-info-ops
              continue: true
    - routes:
        - receiver: fallback-ops
          continue: true
        - receiver: fallback-pager
          continue: true
inhibit_rules:
  - source_matchers: [alertname="deploy_in_progress"]
    target_matchers: [alertname=~"watchdog_.*"]
    equal: [app]
receivers:
  - name: blackhole
  - name: heartbeat
    webhook_configs:
      - url_file: /var/lib/motel-notify/url-NOTIFY_HC_URL
        send_resolved: false
  - name: ch-alice
    discord_configs:
      - webhook_url_file: /var/lib/motel-notify/url-NOTIFY_ALICE_URL
        send_resolved: false
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.app }} {{ .CommonLabels.app }}{{ end }}'
        message: '{{ range .Alerts }}{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: ch-bob
    webhook_configs:
      - url_file: /var/lib/motel-notify/url-NOTIFY_BOB_URL
        send_resolved: false
  - name: ch-ops
    slack_configs:
      - api_url_file: /var/lib/motel-notify/url-NOTIFY_OPS_URL
        send_resolved: false
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.app }} {{ .CommonLabels.app }}{{ end }}'
        title_link: ""
        text: '{{ range .Alerts }}{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
        fallback: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.app }} {{ .CommonLabels.app }}{{ end }}'
        color: '{{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}#439FE0{{ end }}'
  - name: ch-pager
    webhook_configs:
      - url_file: /var/lib/motel-notify/url-NOTIFY_PAGER_URL
